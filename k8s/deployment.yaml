apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiscrape-web
  labels:
    app: aiscrape
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiscrape
      tier: web
  template:
    metadata:
      labels:
        app: aiscrape
        tier: web
    spec:
      containers:
        - name: nextjs
          # Replace with an immutable registry digest during deployment.
          image: ghcr.io/abhisek343/aiscrape:replace-me
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aiscrape-secrets
                  key: DATABASE_URL
            - name: REDIS_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  name: aiscrape-secrets
                  key: REDIS_CONNECTION_URL
            - name: NEXT_PUBLIC_APP_URL
              value: "https://aiscrape.example.com"
            - name: BROWSER_MODE
              value: "remote"
            - name: BRIGHT_DATA_BROWSER_WS
              valueFrom:
                secretKeyRef:
                  name: aiscrape-secrets
                  key: BRIGHT_DATA_BROWSER_WS
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

---

apiVersion: v1
kind: Service
metadata:
  name: aiscrape-web-service
spec:
  type: LoadBalancer
  selector:
    app: aiscrape
    tier: web
  ports:
    - port: 80
      targetPort: 3000

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiscrape-worker
  labels:
    app: aiscrape
    tier: worker
spec:
  replicas: 1 # Scale this up for more concurrency!
  selector:
    matchLabels:
      app: aiscrape
      tier: worker
  template:
    metadata:
      labels:
        app: aiscrape
        tier: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/abhisek343/aiscrape:replace-me
          imagePullPolicy: IfNotPresent
          command: ["npx", "tsx", "worker.ts"] # Override CMD to run worker
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aiscrape-secrets
                  key: DATABASE_URL
            - name: REDIS_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  name: aiscrape-secrets
                  key: REDIS_CONNECTION_URL
            - name: BROWSER_MODE
              value: "remote"
            - name: BRIGHT_DATA_BROWSER_WS
              valueFrom:
                secretKeyRef:
                  name: aiscrape-secrets
                  key: BRIGHT_DATA_BROWSER_WS
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi" # Headless browsers need RAM
