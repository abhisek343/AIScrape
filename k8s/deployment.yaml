apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiscrape-web
  labels:
    app: aiscrape
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiscrape
      tier: web
  template:
    metadata:
      labels:
        app: aiscrape
        tier: web
    spec:
      containers:
        - name: nextjs
          image: aiscrape:latest
          imagePullPolicy: Never # Use local image for minikube
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aiscrape-secrets
                  key: DATABASE_URL
            - name: REDIS_CONNECTION_URL
              value: "redis://redis-service:6379"
            - name: NEXT_PUBLIC_APP_URL
              value: "http://localhost:3000"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

---

apiVersion: v1
kind: Service
metadata:
  name: aiscrape-web-service
spec:
  type: LoadBalancer
  selector:
    app: aiscrape
    tier: web
  ports:
    - port: 80
      targetPort: 3000

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiscrape-worker
  labels:
    app: aiscrape
    tier: worker
spec:
  replicas: 1 # Scale this up for more concurrency!
  selector:
    matchLabels:
      app: aiscrape
      tier: worker
  template:
    metadata:
      labels:
        app: aiscrape
        tier: worker
    spec:
      containers:
        - name: worker
          image: aiscrape:latest
          imagePullPolicy: Never
          command: ["npx", "tsx", "worker.ts"] # Override CMD to run worker
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aiscrape-secrets
                  key: DATABASE_URL
            - name: REDIS_CONNECTION_URL
              value: "redis://redis-service:6379"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi" # Headless browsers need RAM

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379

---

apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
