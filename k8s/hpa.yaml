apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aiscrape-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aiscrape-worker
  minReplicas: 1
  # Browser workers are memory-heavy; set a conservative cap and tune after
  # observing queue depth, browser capacity, and managed Redis limits.
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70 # Scale up when workers are 70% busy
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
