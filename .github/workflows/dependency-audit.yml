name: Dependency security audit

on:
  push:
    branches:
      - chore/dependency-security-20261008

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dependency-security-20261008
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Audit dependency graph
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          console.log('AUDIT_METADATA=' + JSON.stringify(audit.metadata?.vulnerabilities || {}));
          const direct = Object.entries(audit.vulnerabilities || {})
            .filter(([, v]) => v.isDirect)
            .map(([name, v]) => ({
              name,
              severity: v.severity,
              range: v.range,
              fixAvailable: v.fixAvailable,
              via: (v.via || []).map(x => typeof x === 'string' ? x : {
                source: x.source,
                severity: x.severity,
                title: x.title,
                range: x.range,
                url: x.url,
              }),
            }));
          console.log('DIRECT_VULNERABILITIES=' + JSON.stringify(direct));
          NODE
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile after security upgrades"
          git push
